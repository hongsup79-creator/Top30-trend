name: 진단(일회성)
on:
  push:
    paths: [scripts/diag_naver.py]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python scripts/diag_naver.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug && git commit -m "debug: 네이버 가격 출처 진단" && git pull --rebase origin main && git push
