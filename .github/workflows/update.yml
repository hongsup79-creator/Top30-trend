name: TOP30 데이터 갱신

on:
  schedule:
    # 평일 20:30 KST (= 11:30 UTC) — 네이버 차트가 애프터마켓(~20:00) 반영 후 확정
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# 실행 버튼을 연달아 눌러도 한 번에 하나씩만 돌도록 (데이터 커밋 충돌 방지)
concurrency:
  group: top30-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - run: python scripts/update_top30.py

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 갱신"
          git pull --rebase -X theirs origin main
          git push
